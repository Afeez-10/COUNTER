<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <title>COUNTER</title>
</head>
<body>
  <p class="count-paragraph">COUNTER</p>
  <div class="number-count">0</div>
  <div class="buttons">
  <button class="subtracter" onclick="
  subtractOne();">-</button>
  <button class="resetter" onclick="
  resetCount();">RESET</button>
  <button class="adder" onclick="
  addOne();">+</button>
  </div>
  <p class="high-paragraph">HIGHEST COUNT</p>
  <p class="high-count">0</p>
  <button class="high-resetter" onclick="
  resetHighestCount();">RESET HIGHEST COUNT</button>
  <script src="script.js"></script>
</body>
</html>
